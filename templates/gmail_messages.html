<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLUE CAB | Gmail</title><style>body{font:15px Arial;color:#17365d;background:#eef3f8;margin:20px}.card{max-width:950px;margin:auto;background:white;padding:22px;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}button{padding:10px;background:#17365d;color:white;border:0;border-radius:7px}input{padding:8px;max-width:150px}.sub{font-size:12px;color:#5d7185}@media(max-width:650px){td,th{display:block}}</style></head><body><div class="card"><a href="/">← Panele dön</a><h1>Excel ekli son e-postalar</h1><p>MASTER: {{master_version}}. Yalnızca seçilen e-postadaki Excel ekleri işlenir.</p><table><thead><tr><th>E-posta</th><th>İşlem</th></tr></thead><tbody>{% for r in rows %}<tr><td><b>{{r.subject}}</b><div class="sub">{{r['from']}}<br>{{r.date}}</div></td><td><form action="{{url_for('gmail_process',message_id=r.id)}}" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="master_version" value="{{master_version}}"><input aria-label="Teslimat tarihi" type="date" name="date"><button>Kuryeye böl</button></form></td></tr>{% else %}<tr><td>Uygun e-posta bulunamadı.</td></tr>{% endfor %}</tbody></table></div></body></html>
